name: CI

on:
  push:
    branches: [ "master", "main", "nightly", "dev" ]
  pull_request:
    branches: [ "master", "main", "nightly", "dev" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v5
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.94
        components: rustfmt, clippy

    # Moved Rustfmt before Cache as requested
    - name: Rustfmt
      run: cargo fmt --all -- --check

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
      
    - name: Install NASM
      uses: ilammy/setup-nasm@v1
      
    - name: Install LLVM & Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang libclang-dev pkg-config gcc-multilib g++-multilib
        
    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cmake = Get-Command cmake -ErrorAction SilentlyContinue
        if (-not $cmake) {
          foreach ($candidate in @(
            "$env:ProgramFiles\\CMake\\bin\\cmake.exe",
            "$env:ProgramFiles(x86)\\CMake\\bin\\cmake.exe"
          )) {
            if (Test-Path $candidate) {
              $cmake = Get-Item $candidate
              break
            }
          }
        }
        if (-not $cmake) {
          throw "cmake not found on the runner"
        }

        $clang = Get-Command clang -ErrorAction SilentlyContinue
        if (-not $clang) {
          foreach ($candidate in @(
            "$env:ProgramFiles\\LLVM\\bin\\clang.exe",
            "$env:ProgramFiles(x86)\\LLVM\\bin\\clang.exe"
          )) {
            if (Test-Path $candidate) {
              $clang = Get-Item $candidate
              break
            }
          }
        }
        if (-not $clang) {
          throw "clang not found on the runner"
        }

        $clangPath = if ($clang.Source) { $clang.Source } else { $clang.FullName }
        $libclangDir = Split-Path $clangPath -Parent
        "LIBCLANG_PATH=$libclangDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        
    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm cmake
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

    - name: Check compilation
      run: cargo check --verbose --all-targets --all-features

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --verbose --workspace --all-features --locked
