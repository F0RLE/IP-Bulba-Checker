name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in vX.Y.Z format'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Native builds ─────────────────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bulbascan
            asset: bulbascan-linux-amd64
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bulbascan.exe
            asset: bulbascan-windows-amd64.exe
            use_cross: false

          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: bulbascan.exe
            asset: bulbascan-windows-x86.exe
            use_cross: false

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bulbascan
            asset: bulbascan-macos-amd64
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bulbascan
            asset: bulbascan-macos-arm64
            use_cross: false

          # ── Cross-compiled via cross-rs (Docker) ──────────────────────────────
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: bulbascan
            asset: bulbascan-linux-arm64
            use_cross: true

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install NASM (native builds)
        if: ${{ !matrix.use_cross }}
        uses: ilammy/setup-nasm@v1

      - name: Install system dependencies (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      # cross-rs manages its own Docker image with all cross-compilation dependencies
      - name: Build (cross — Linux ARM64)
        if: ${{ matrix.use_cross }}
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked
          strip: true

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact }} ${{ matrix.asset }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item "target\${{ matrix.target }}\release\${{ matrix.artifact }}" "${{ matrix.asset }}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
