name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in vX.Y.Z format'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      notes_path: ${{ steps.prepare.outputs.notes_path }}
      has_notes: ${{ steps.prepare.outputs.has_notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release source and create tag
        id: prepare
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release workflow must be started from main." >&2
            exit 1
          fi

          TAG_INPUT="${{ inputs.tag }}"
          if [[ "$TAG_INPUT" != v* ]]; then
            RELEASE_TAG="v$TAG_INPUT"
          else
            RELEASE_TAG="$TAG_INPUT"
          fi

          NOTES_PATH="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$NOTES_PATH" ]; then
            HAS_NOTES=true
          else
            HAS_NOTES=false
          fi

          git fetch origin main --tags
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists, reusing it."
          else
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
          echo "has_notes=$HAS_NOTES" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          NOTES_PATH: ${{ steps.prepare.outputs.notes_path }}
          HAS_NOTES: ${{ steps.prepare.outputs.has_notes }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$HAS_NOTES" = "true" ]; then
              gh release edit "$RELEASE_TAG" --title "Release $RELEASE_TAG" --notes-file "$NOTES_PATH" --latest
            else
              gh release edit "$RELEASE_TAG" --title "Release $RELEASE_TAG" --notes "" --latest
            fi
          else
            if [ "$HAS_NOTES" = "true" ]; then
              gh release create "$RELEASE_TAG" --title "Release $RELEASE_TAG" --notes-file "$NOTES_PATH" --latest
            else
              gh release create "$RELEASE_TAG" --title "Release $RELEASE_TAG" --generate-notes --latest
            fi
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bulbascan
            asset_name: bulbascan-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bulbascan.exe
            asset_name: bulbascan-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: bulbascan
            asset_name: bulbascan-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: bulbascan
            asset_name: bulbascan-macos-arm64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: bulbascan
            asset_name: bulbascan-linux-arm64
          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: bulbascan.exe
            asset_name: bulbascan-windows-x86.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config gcc-multilib g++-multilib

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmake = Get-Command cmake -ErrorAction SilentlyContinue
          if (-not $cmake) {
            foreach ($candidate in @(
              "$env:ProgramFiles\\CMake\\bin\\cmake.exe",
              "$env:ProgramFiles(x86)\\CMake\\bin\\cmake.exe"
            )) {
              if (Test-Path $candidate) {
                $cmake = Get-Item $candidate
                break
              }
            }
          }
          if (-not $cmake) {
            throw "cmake not found on the runner"
          }

          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            foreach ($candidate in @(
              "$env:ProgramFiles\\LLVM\\bin\\clang.exe",
              "$env:ProgramFiles(x86)\\LLVM\\bin\\clang.exe"
            )) {
              if (Test-Path $candidate) {
                $clang = Get-Item $candidate
                break
              }
            }
          }
          if (-not $clang) {
            throw "clang not found on the runner"
          }

          $clangPath = if ($clang.Source) { $clang.Source } else { $clang.FullName }
          $libclangDir = Split-Path $clangPath -Parent
          "LIBCLANG_PATH=$libclangDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Install Zig Build Tool (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          python3 -m pip install --user ziglang
          cargo install --locked cargo-zigbuild
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Linux ARM64 C toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          {
            echo "CC_aarch64_unknown_linux_gnu=clang"
            echo "CXX_aarch64_unknown_linux_gnu=clang++"
          } >> "$GITHUB_ENV"

      - name: Build Release
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Prepare Artifact (Unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item -Path "target\${{ matrix.target }}\release\${{ matrix.artifact_name }}" -Destination "${{ matrix.asset_name }}"

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset_name }}" --clobber
