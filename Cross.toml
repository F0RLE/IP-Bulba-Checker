[build.env]
passthrough = ["LIBCLANG_PATH", "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu"]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
  "dpkg --add-architecture $CROSS_DEB_ARCH",
  "apt-get update && apt-get --assume-yes install clang libclang-dev llvm-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross"
]
